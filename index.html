<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess — Play vs AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="app-container">
  <header class="top-bar glass-panel">
    <div class="top-bar-left">
      <span class="logo">Chess</span>
    </div>
    <div class="top-bar-center">
      <span class="level-badge" id="level-badge">Lvl 5 · Club Player</span>
    </div>
    <div class="top-bar-right">
      <button class="btn btn-primary" id="btn-new-game">New Game</button>
    </div>
  </header>

  <!-- ===== Game Area ===== -->
  <main class="game-area">
    <!-- Board Section -->
    <div class="board-section">
      <div class="captured-pieces" id="captured-top"></div>

      <div id="board-container"></div>

      <div class="captured-pieces" id="captured-bottom"></div>

      <div class="status-bar">
        <span id="status-text">Your turn</span>
        <span class="thinking" id="thinking-indicator">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
      </div>

      <div class="controls">
        <button class="btn" id="btn-undo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h10a5 5 0 0 1 0 10H9"/><polyline points="3 10 7 6"/><polyline points="3 10 7 14"/></svg>
          Undo
        </button>
        <button class="btn" id="btn-flip">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          Flip
        </button>
      </div>
    </div>

    <!-- Side Panel -->
    <aside class="side-panel glass-panel">
      <h3 class="panel-title">Moves</h3>
      <div class="move-history" id="move-list"></div>
    </aside>
  </main>
</div>

<!-- ===== Level Selection Modal ===== -->
<div class="level-modal" id="level-modal">
  <div class="level-modal-content glass-panel">
    <h2>Choose Difficulty</h2>
    <p>Select an AI level to play against</p>
    <div class="level-grid" id="level-grid"></div>
    <button class="btn btn-primary btn-start" id="btn-start-game">Start Game</button>
  </div>
</div>

<!-- ===== Game Over Overlay ===== -->
<div class="game-over-overlay" id="game-over-overlay">
  <div class="game-over-content glass-panel">
    <h2 id="game-over-result">Checkmate</h2>
    <p id="game-over-sub">You Win!</p>
    <div class="game-over-buttons">
      <button class="btn btn-primary" id="game-over-new">New Game</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
